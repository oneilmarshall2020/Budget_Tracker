[pytest]
# Run with:  pytest            (from the backend folder, venv active)
# Quieter:   pytest -q         One file: pytest tests/test_reports.py   One test: pytest -k undo
testpaths = tests
pythonpath = .
# A library we use (Starlette's test client) prints harmless deprecation notices: hide them.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:Using .httpx. with .starlette.testclient.
