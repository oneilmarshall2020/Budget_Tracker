[pytest]
# Run with:  pytest            (from the backend folder, venv active)
# Quieter:   pytest -q         One file: pytest tests/test_reports.py   One test: pytest -k undo
testpaths = tests
pythonpath = .
# A library we use (Starlette's test client) prints a harmless deprecation notice: hide it.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
